<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminary Breakfast Sign-up</title>
    <style>
        :root {
            --primary-blue: #0A84FF;
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #1D1D1F;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            /* Prevents scrolling while intro plays */
            overflow-x: hidden; 
        }

        /* --- Cinematic Intro System --- */
        @keyframes sparkShift {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.8; }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }

        .fade-in-triple-a {
            animation: simpleFadeIn 1.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes simpleFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #2d3436 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
            color: white;
            transition: opacity 1.5s ease, visibility 1.5s;
            font-family: serif;
            visibility: visible;
        }

        #intro-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        #intro-content {
            text-align: center;
            transform: translateY(15px);
            z-index: 2;
        }

        .cinematic-text-main {
            font-size: 2.5rem;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .cinematic-text-sub {
            font-size: 1rem;
            letter-spacing: 0.15rem;
            opacity: 0.8;
        }

        #spark-container {
            position: absolute; width: 100%; height: 100%; z-index: 1;
        }

        .spark {
            position: absolute;
            width: 4px; height: 4px;
            background: white; border-radius: 50%;
            filter: blur(1.5px);
        }

        /* --- Main App Styling --- */
        /* Hides container until intro finishes */
        body > .container {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 2s ease, transform 1s ease-out;
        }

        body.reveal .container {
            opacity: 1;
            transform: translateY(0);
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        .logo-image {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 0 auto 20px auto;
        }

        h1 { text-align: center; font-weight: 600; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #d2d2d7;
            border-radius: 10px; box-sizing: border-box; font-size: 16px;
        }

        button {
            width: 100%; padding: 14px; background-color: var(--primary-blue);
            color: white; border: none; border-radius: 10px; font-size: 16px;
            font-weight: 600; cursor: pointer; transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover { background-color: #0071E3; }

        /* --- Calendar Grid --- */
        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-top: 30px;
            color: #86868B;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .day {
            background: #f9f9f9;
            border-radius: 8px;
            min-height: 80px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 14px;
        }

        .day.friday {
            background: #E8F2FF;
            border: 1px solid var(--primary-blue);
            cursor: pointer;
            transition: background 0.2s;
        }

        .day.friday:hover {
            background: #D1E5FF;
        }

        .signup-tag {
            font-size: 10px;
            background: var(--primary-blue);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: auto;
            align-self: center;
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>

<!-- High-End Intro Visualization -->
<div id="intro-screen">
    <svg id="transition-path" style="width: 150px; height: 150px; fill: white; opacity: 0.8; margin-bottom: 20px; z-index: 2;" viewBox="0 0 100 100">
        <path d="M50 0 L100 50 L50 100 L0 50 Z" />
    </svg>
    
    <div id="spark-container"></div>
    
    <div id="intro-content" class="fade-in-triple-a">
        <h1 class="cinematic-text-main">Seminary Fridays</h1>
        <p class="cinematic-text-sub">Nourishing Body & Spirit</p>
    </div>
</div>

<!-- Main Application UI -->
<div class="container">
    <!-- Drop the black and white logo you downloaded into your folder and update this src -->
    <img src="your-custom-logo.png" alt="Seminary Logo" class="logo-image">

    <h1>Breakfast Sign-up</h1>
    
    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="E.g., Moroni" required>
    </div>

    <div class="form-group">
        <label for="date">Which Friday?</label>
        <input type="date" id="date" required>
    </div>

    <div class="form-group">
        <label for="item">What are you bringing?</label>
        <input type="text" id="item" placeholder="E.g., Cinnamon Rolls & Chocolate Milk" required>
    </div>

    <button id="submitBtn">Commit</button>

    <!-- Calendar View -->
    <div class="calendar-header">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="calendar-grid" id="calendarGrid">
        <!-- JavaScript populates this -->
    </div>
</div>

<!-- Script for UI Logic, Intro, and Calendar -->
<script>
    window.addEventListener('load', () => {
        // 1. Generate spark particles
        const sparks = 30;
        const sparkContainer = document.getElementById('spark-container');
        for (let i = 0; i < sparks; i++) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.top = `${Math.random() * 100}%`;
            spark.style.animation = `sparkShift ${2 + Math.random() * 3}s ease-in-out infinite`;
            spark.style.animationDelay = `${Math.random() * 2}s`;
            sparkContainer.appendChild(spark);
        }

        // 2. SVG Shape Transition (Square to Star-ish compass)
        setTimeout(() => {
            const path = document.querySelector('#transition-path path');
            path.setAttribute('d', 'M50 0 L61 35 L100 35 L69 57 L81 91 L50 70 L19 91 L31 57 L0 35 L39 35 Z');
            path.style.transition = 'd 1.5s ease-in-out';
        }, 800);

        // 3. Fade out intro, reveal main app
        setTimeout(() => {
            document.getElementById('intro-screen').classList.add('hide');
            document.body.classList.add('reveal');
        }, 3800);
    });

    // Generate Calendar Grid
    const calendarGrid = document.getElementById('calendarGrid');
    for(let i = 1; i <= 30; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.textContent = i;
        
        // Mock Fridays for layout visualization
        if (i === 4 || i === 11 || i === 18 || i === 25) {
            dayDiv.classList.add('friday');
            
            // Allow clicking a Friday to auto-fill the date input (Mock setup)
            dayDiv.addEventListener('click', () => {
                // In a real app, calculate the actual date string (YYYY-MM-DD)
                alert(`You selected Friday the ${i}th!`);
            });

            if(i === 11) {
                const tag = document.createElement('div');
                tag.classList.add('signup-tag');
                tag.textContent = "Brother Smith: Muffins";
                dayDiv.appendChild(tag);
            }
        }
        calendarGrid.appendChild(dayDiv);
    }
</script>

</body>
</html>
