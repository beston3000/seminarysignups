<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminary Food Signups</title>
    <style>
        :root {
            /* Premium Slate Color Palette */
            --primary: #0F172A;
            --primary-hover: #334155;
            --white: #ffffff;
            --bg-color: #F8FAFC;
            --border-color: #E2E8F0;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #f1f5f9, transparent 400px);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Cinematic Curtain Intro --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: var(--white);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            font-family: Georgia, serif;
        }
        #intro-screen.slide-up { transform: translateY(-100%); }
        .intro-text {
            font-size: 1.8rem; letter-spacing: 0.15rem; text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;
            animation: fadeInOut 2.5s ease-in-out forwards; opacity: 0; padding: 0 20px;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        /* --- Main App Layout --- */
        .app-wrapper {
            opacity: 0; transform: scale(0.95) translateY(20px);
            transition: opacity 1s ease 0.5s, transform 1s cubic-bezier(0.165, 0.84, 0.44, 1) 0.5s;
            width: 100%; max-width: 900px;
        }
        body.reveal .app-wrapper { opacity: 1; transform: scale(1) translateY(0); }

        .card-container {
            background: var(--white); border-radius: 28px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            overflow: hidden; display: grid; grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .card-container { grid-template-columns: 1.2fr 1fr; }
            body { padding: 40px; }
        }

        .section { padding: 35px; }
        @media (min-width: 768px) { .section { padding: 50px; } }
        
        .calendar-section { background: var(--white); border-right: 1px solid var(--border-color); }
        .form-section { background: #FAFAFB; display: flex; flex-direction: column; justify-content: center;}

        h1, h2 { text-transform: uppercase; letter-spacing: -0.5px; margin-top: 0; color: var(--primary); }
        h1 { font-size: 1.6rem; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 24px; font-weight: 800; }

        /* --- Calendar Grid --- */
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: var(--text-muted);
            font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 15px; }

        .day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 600; color: #CBD5E1; border-radius: 14px;
        }

        .day.friday {
            color: var(--primary); border: 2px solid var(--border-color); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
            background: var(--white);
        }

        .day.friday:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); }
        .day.friday.selected { border-color: var(--primary); background: #F1F5F9; transform: scale(1.05); }
        
        /* Claimed State */
        .day.friday.claimed { background: var(--primary); color: var(--white); border-color: var(--primary); }
        .day.friday.claimed .click-hint { color: #94A3B8; }
        .day.friday.claimed:hover { background: var(--primary-hover); }

        .click-hint { font-size: 0.65rem; text-transform: uppercase; margin-top: 2px; font-weight: 700; }

        /* --- Forms & Buttons --- */
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        
        input {
            width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 14px; box-sizing: border-box; 
            font-size: 1rem; outline: none; transition: all 0.2s; background: var(--white); color: var(--text-main); font-weight: 500;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05); }

        button.primary-btn {
            width: 100%; padding: 18px; background-color: var(--primary); color: var(--white); border: none; border-radius: 14px; 
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
            margin-top: 10px;
        }
        button.primary-btn:hover { background-color: var(--primary-hover); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15); transform: translateY(-1px); }
        button.primary-btn:active { transform: scale(0.98); }

        /* --- Custom Modal for Viewing Claims --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--white); padding: 35px; border-radius: 24px;
            width: 85%; max-width: 360px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95) translateY(10px); transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        
        .modal-date { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }
        .modal-title { font-size: 1.6rem; margin-bottom: 8px; font-weight: 800; color: var(--primary); }
        .modal-subtitle { color: var(--text-main); margin-bottom: 30px; font-size: 1.1rem; font-weight: 500; background: var(--bg-color); padding: 10px; border-radius: 10px; }
        
        .modal-btn {
            width: 100%; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; 
            border: none; font-size: 1rem; transition: all 0.2s;
        }
        .modal-close-btn { background: var(--bg-color); color: var(--text-main); margin-bottom: 12px; border: 1px solid var(--border-color); }
        .modal-close-btn:hover { background: var(--border-color); }
        .modal-delete-btn { background: var(--danger-bg); color: var(--danger); }
        .modal-delete-btn:hover { background: #FEE2E2; }
    </style>
</head>
<body>

<!-- Sleek Curtain Intro -->
<div id="intro-screen">
    <div class="intro-text">Seminary Food Signups</div>
</div>

<!-- Modal Popup for Viewing Claims -->
<div class="modal-overlay" id="claimModal">
    <div class="modal-content">
        <div class="modal-date" id="modalDate">Oct 13, 2026</div>
        <div class="modal-title" id="modalName">Name</div>
        <div class="modal-subtitle" id="modalItem">Item</div>
        <button class="modal-btn modal-close-btn" id="modalCloseBtn">Close</button>
        <button class="modal-btn modal-delete-btn" id="modalDeleteBtn">Remove Sign-up</button>
    </div>
</div>

<!-- Main App -->
<div class="app-wrapper">
    <div class="card-container">
        
        <!-- Left Side: Calendar -->
        <div class="section calendar-section">
            <img src="your-custom-logo.png" alt="Seminary Logo" style="width: 100%; max-width: 120px; margin: 0 auto 25px auto; display: block; opacity: 0.9;">
            <h1>Select Date</h1>
            <div class="calendar-header">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS Populates Dates -->
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="section form-section">
            <h1>Commit</h1>
            
            <div class="form-group">
                <label for="date">Selected Date (Tap a Friday)</label>
                <input type="date" id="date" required readonly style="background: var(--border-color); color: var(--text-muted); border: none; font-weight: 600;">
            </div>

            <div class="form-group">
                <label for="name">Who are you?</label>
                <input type="text" id="name" placeholder="E.g., Nephi" required>
            </div>

            <!-- Optional Tag is visually cleaner now -->
            <div class="form-group">
                <label for="item">What are you bringing? <span style="font-weight: 400; text-transform: none; color: #94A3B8;">(Optional)</span></label>
                <input type="text" id="item" placeholder="E.g., Bagels">
            </div>

            <button id="submitBtn" class="primary-btn">Sign Up</button>
        </div>

    </div>
</div>

<!-- UI & Calendar Generation Script -->
<script>
    // --- Intro ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            intro.classList.add('slide-up');
            document.body.classList.add('reveal');
            setTimeout(() => intro.remove(), 1200); 
        }, 2000); // Sped up the intro slightly so it feels snappier
    });

    // --- Smart Calendar Logic ---
    const calendarGrid = document.getElementById('calendarGrid');
    const dateInput = document.getElementById('date');
    
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i = 0; i < firstDay; i++) {
        calendarGrid.appendChild(document.createElement('div'));
    }

    for(let i = 1; i <= daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.textContent = i;
        
        if (new Date(year, month, i).getDay() === 5) {
            dayDiv.classList.add('friday');
            
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(i).padStart(2, '0');
            const exactDate = `${year}-${formattedMonth}-${formattedDay}`;
            dayDiv.dataset.date = exactDate;
            
            const hint = document.createElement('div');
            hint.classList.add('click-hint');
            hint.textContent = "Open";
            dayDiv.appendChild(hint);
        }
        calendarGrid.appendChild(dayDiv);
    }

    // --- Modal Logic ---
    const modal = document.getElementById('claimModal');
    document.getElementById('modalCloseBtn').addEventListener('click', () => {
        modal.classList.remove('active');
    });
</script>

<!-- Firebase Connection & Real-time Database Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDR4--N5B5jKcrEb6nMzlIiTianU2kFMOU",
    authDomain: "seminarysignups.firebaseapp.com",
    projectId: "seminarysignups",
    storageBucket: "seminarysignups.firebasestorage.app",
    messagingSenderId: "22098394544",
    appId: "1:22098394544:web:310530f12eb50d1e232a75",
    measurementId: "G-H9039RGE0G"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- 1. Submitting a new Sign Up ---
  document.getElementById('submitBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const date = document.getElementById('date').value;
      const item = document.getElementById('item').value.trim(); // Removed default surprise text
      const btn = document.getElementById('submitBtn');

      if(name && date) {
          try {
              btn.textContent = "Saving...";
              btn.disabled = true;
              
              await addDoc(collection(db, "signups"), {
                  name: name,
                  date: date,
                  item: item, // Now saves as whatever they typed, or an empty string
                  timestamp: new Date()
              });
              
              // Clear form
              document.getElementById('name').value = '';
              document.getElementById('item').value = '';
              document.getElementById('date').value = '';
              document.querySelectorAll('.day.friday').forEach(el => el.classList.remove('selected'));
              
          } catch (error) {
              console.error("Error adding doc: ", error);
              alert("Error saving! Check console.");
          } finally {
              btn.textContent = "Sign Up";
              btn.disabled = false;
          }
      } else {
          alert("Please select a date and enter your name!");
      }
  });

  // --- 2. Live Calendar Updates & Clicking Logic ---
  const q = query(collection(db, "signups"));

  onSnapshot(q, (snapshot) => {
      // First, reset all Fridays to "Open" status
      document.querySelectorAll('.day.friday').forEach(el => {
          el.classList.remove('claimed');
          el.querySelector('.click-hint').textContent = "Open";
          delete el.dataset.claimId; 
          delete el.dataset.claimItem;
          delete el.dataset.claimName;
          
          // Attach standard click to select date
          el.onclick = function() {
              if(!this.classList.contains('claimed')) {
                  document.querySelectorAll('.day.friday').forEach(d => d.classList.remove('selected'));
                  this.classList.add('selected');
                  document.getElementById('date').value = this.dataset.date;
                  
                  // Mobile auto-scroll
                  if(window.innerWidth < 768) {
                      document.getElementById('name').scrollIntoView({ behavior: 'smooth', block: 'center' });
                  }
                  document.getElementById('name').focus();
              }
          };
      });

      // Now, apply "Claimed" status from Firebase
      snapshot.forEach((firebaseDoc) => {
          const data = firebaseDoc.data();
          const targetDay = document.querySelector(`.day.friday[data-date="${data.date}"]`);
          
          if(targetDay) {
              targetDay.classList.add('claimed');
              targetDay.classList.remove('selected');
              targetDay.querySelector('.click-hint').textContent = "Claimed";
              
              // Store claim data directly on the HTML element
              targetDay.dataset.claimId = firebaseDoc.id;
              targetDay.dataset.claimName = data.name;
              targetDay.dataset.claimItem = data.item || ""; // Default to empty string if missing
              
              // Change click behavior to open the modal instead
              targetDay.onclick = function() {
                  const dateObj = new Date(this.dataset.date + 'T12:00:00');
                  const niceDate = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                  
                  document.getElementById('modalDate').textContent = niceDate;
                  document.getElementById('modalName').textContent = this.dataset.claimName;
                  
                  // Logic for displaying the item if they left it blank
                  const itemText = this.dataset.claimItem.trim();
                  document.getElementById('modalItem').textContent = itemText !== "" ? `Bringing: ${itemText}` : "Item: TBD";
                  
                  // Setup delete button for this specific claim
                  const deleteBtn = document.getElementById('modalDeleteBtn');
                  deleteBtn.onclick = async () => {
                      if(confirm("Remove this sign-up?")) {
                          await deleteDoc(doc(db, "signups", this.dataset.claimId));
                          document.getElementById('claimModal').classList.remove('active');
                      }
                  };

                  // Show modal
                  document.getElementById('claimModal').classList.add('active');
              };
          }
      });
  });
</script>

</body>
</html>
