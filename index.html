<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminary Breakfast Sign-up</title>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --light-gray: #f0f0f0;
            --dark-gray: #666666;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--white);
            color: var(--black);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            overflow-x: hidden; 
        }

        /* --- Cinematic Intro System --- */
        @keyframes sparkShift {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.8; }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }

        .fade-in-triple-a {
            animation: simpleFadeIn 1.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes simpleFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--black);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
            color: var(--white);
            transition: opacity 1.5s ease, visibility 1.5s;
            font-family: Georgia, serif;
            visibility: visible;
        }

        #intro-screen.hide { opacity: 0; visibility: hidden; }
        #intro-content { text-align: center; transform: translateY(15px); z-index: 2; }
        
        .cinematic-text-main {
            font-size: 2.5rem; letter-spacing: 0.2rem;
            text-transform: uppercase; margin-bottom: 0.5rem;
        }
        
        .cinematic-text-sub {
            font-size: 1.2rem; letter-spacing: 0.1rem; opacity: 0.8;
        }

        #spark-container { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .spark {
            position: absolute; width: 4px; height: 4px;
            background: var(--white); border-radius: 50%; filter: blur(1.5px);
        }

        /* --- Main App UI --- */
        body > .container {
            opacity: 0; transform: translateY(30px);
            transition: opacity 2s ease, transform 1s ease-out;
        }

        body.reveal .container { opacity: 1; transform: translateY(0); }

        .container {
            background: var(--white);
            padding: 20px;
            margin-top: 20px;
        }

        .logo-image {
            width: 100%; max-width: 250px;
            display: block; margin: 0 auto 30px auto;
        }

        h1 { text-align: center; font-size: 2rem; border-bottom: 4px solid var(--black); padding-bottom: 10px; text-transform: uppercase; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem; }
        
        input {
            width: 100%; padding: 18px; 
            border: 3px solid var(--black);
            border-radius: 8px; box-sizing: border-box; 
            font-size: 1.2rem; outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        input:focus { background-color: var(--light-gray); }

        button {
            width: 100%; padding: 20px; 
            background-color: var(--black); color: var(--white); 
            border: none; border-radius: 8px; 
            font-size: 1.5rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer; transition: transform 0.1s, background-color 0.2s;
            margin-top: 20px;
        }
        button:hover { background-color: #333; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #999; cursor: not-allowed; }

        /* --- High Contrast Calendar Grid --- */
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr);
            text-align: center; font-weight: bold; margin-top: 20px;
            color: var(--dark-gray); font-size: 1rem; border-bottom: 2px solid var(--black);
            padding-bottom: 10px;
        }
        
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 10px; margin-top: 15px; margin-bottom: 30px;
        }

        .day {
            min-height: 80px; padding: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: bold; color: #ccc;
            border-radius: 8px;
        }

        .day.friday {
            color: var(--black);
            border: 3px solid var(--black);
            cursor: pointer;
            transition: all 0.2s;
        }

        .day.friday:hover { background: var(--light-gray); }
        
        .day.friday.selected {
            background: var(--black);
            color: var(--white);
        }

        .click-hint {
            font-size: 0.8rem; font-weight: normal; margin-top: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<!-- Intro Sequence -->
<div id="intro-screen">
    <svg id="transition-path" style="width: 150px; height: 150px; fill: white; margin-bottom: 20px; z-index: 2;" viewBox="0 0 100 100">
        <path d="M50 0 L100 50 L50 100 L0 50 Z" />
    </svg>
    <div id="spark-container"></div>
    <div id="intro-content" class="fade-in-triple-a">
        <h1 class="cinematic-text-main">Seminary Fridays</h1>
        <p class="cinematic-text-sub">Sleek. Simple. Nourishing.</p>
    </div>
</div>

<!-- Main UI -->
<div class="container">
    <img src="your-custom-logo.png" alt="Seminary Logo" class="logo-image">

    <h1>Breakfast Sign-up</h1>
    
    <div class="calendar-header">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div class="calendar-grid" id="calendarGrid">
        <!-- JavaScript populates real dates here -->
    </div>
    
    <div class="form-group">
        <label for="date">Selected Date</label>
        <input type="date" id="date" required readonly style="background: #f0f0f0;">
    </div>

    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="E.g., Nephi" required>
    </div>

    <div class="form-group">
        <label for="item">What are you bringing?</label>
        <input type="text" id="item" placeholder="E.g., 2 Dozen Bagels" required>
    </div>

    <button id="submitBtn">Confirm Sign Up</button>
</div>

<!-- UI Logic Script -->
<script>
    // --- Intro Sequence ---
    window.addEventListener('load', () => {
        const sparks = 30;
        const sparkContainer = document.getElementById('spark-container');
        for (let i = 0; i < sparks; i++) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.top = `${Math.random() * 100}%`;
            spark.style.animation = `sparkShift ${2 + Math.random() * 3}s ease-in-out infinite`;
            spark.style.animationDelay = `${Math.random() * 2}s`;
            sparkContainer.appendChild(spark);
        }

        setTimeout(() => {
            const path = document.querySelector('#transition-path path');
            path.setAttribute('d', 'M50 0 L61 35 L100 35 L69 57 L81 91 L50 70 L19 91 L31 57 L0 35 L39 35 Z');
            path.style.transition = 'd 1.5s ease-in-out';
        }, 800);

        setTimeout(() => {
            document.getElementById('intro-screen').classList.add('hide');
            document.body.classList.add('reveal');
        }, 3800);
    });

    // --- Smart Calendar Logic ---
    const calendarGrid = document.getElementById('calendarGrid');
    const dateInput = document.getElementById('date');
    
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i = 0; i < firstDay; i++) {
        const emptyDiv = document.createElement('div');
        calendarGrid.appendChild(emptyDiv);
    }

    for(let i = 1; i <= daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        
        const currentDate = new Date(year, month, i);
        dayDiv.textContent = i;
        
        if (currentDate.getDay() === 5) {
            dayDiv.classList.add('friday');
            
            const hint = document.createElement('div');
            hint.classList.add('click-hint');
            hint.textContent = "Select";
            dayDiv.appendChild(hint);
            
            dayDiv.addEventListener('click', function() {
                document.querySelectorAll('.day.friday').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(i).padStart(2, '0');
                dateInput.value = `${year}-${formattedMonth}-${formattedDay}`;
                
                document.getElementById('name').focus();
            });
        }
        calendarGrid.appendChild(dayDiv);
    }
</script>

<!-- Firebase Connection Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  // Your actual Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDR4--N5B5jKcrEb6nMzlIiTianU2kFMOU",
    authDomain: "seminarysignups.firebaseapp.com",
    projectId: "seminarysignups",
    storageBucket: "seminarysignups.firebasestorage.app",
    messagingSenderId: "22098394544",
    appId: "1:22098394544:web:310530f12eb50d1e232a75",
    measurementId: "G-H9039RGE0G"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById('submitBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value;
      const date = document.getElementById('date').value;
      const item = document.getElementById('item').value;
      const btn = document.getElementById('submitBtn');

      if(name && date && item) {
          try {
              // Show loading state
              btn.textContent = "Saving...";
              btn.disabled = true;
              
              // Push to Firestore database
              await addDoc(collection(db, "signups"), {
                  name: name,
                  date: date,
                  item: item,
                  timestamp: new Date()
              });
              
              alert(`Awesome! You're officially signed up to bring ${item} on ${date}.`);
              
              // Clear form after success
              document.getElementById('name').value = '';
              document.getElementById('item').value = '';
              document.getElementById('date').value = '';
              document.querySelectorAll('.day.friday').forEach(el => el.classList.remove('selected'));
              
          } catch (error) {
              console.error("Error adding document: ", error);
              alert("Error saving! Make sure your Firestore database is created and set to Test Mode.");
          } finally {
              // Reset button
              btn.textContent = "Confirm Sign Up";
              btn.disabled = false;
          }
      } else {
          alert("Please select a Friday from the calendar and fill out all fields!");
      }
  });
</script>

</body>
</html>
