<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seminary Food Signups</title>
    <style>
        :root {
            /* Premium Slate & Blue Palette */
            --primary: #0F172A;
            --primary-hover: #1E293B;
            --accent: #2563EB;
            --white: #ffffff;
            --bg-color: #F8FAFC;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
            color: var(--text-main);
            margin: 0;
            padding: 15px; /* Tighter padding for mobile */
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- ACTION PACKED INTRO SYSTEM --- */
        #intro-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1E293B, #0F172A);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: var(--white); overflow: hidden;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1), opacity 1.2s ease;
        }
        #intro-screen.slide-up { transform: translateY(-100%); opacity: 0; }

        .intro-grid {
            position: absolute; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 3s linear infinite;
            opacity: 0.6;
        }
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        .shockwave {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: transparent; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            animation: shockwaveBoom 1.5s ease-out 0.4s forwards;
            opacity: 0; z-index: 1;
        }
        @keyframes shockwaveBoom {
            0% { width: 10px; height: 10px; opacity: 1; border-width: 10px; }
            100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
        }

        .intro-content { position: relative; z-index: 2; text-align: center; padding: 0 20px; }
        .intro-word { text-transform: uppercase; font-weight: 900; line-height: 1; }
        
        .word-1 {
            font-size: clamp(2.5rem, 8vw, 3.5rem); letter-spacing: 0.2rem; color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: slamIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(3);
        }
        @keyframes slamIn {
            0% { opacity: 0; transform: scale(3); }
            50% { opacity: 1; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .word-2 {
            font-size: clamp(1.2rem, 4vw, 1.5rem); letter-spacing: 0.2rem; color: #94A3B8; margin-top: 15px;
            animation: slideUpFade 1s cubic-bezier(0.165, 0.84, 0.44, 1) 1s forwards, 
                       textShine 3s linear 1.5s infinite;
            opacity: 0; transform: translateY(40px);
            background: linear-gradient(90deg, #94A3B8 0%, #ffffff 50%, #94A3B8 100%);
            background-size: 200% auto; color: transparent;
            -webkit-background-clip: text; background-clip: text;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes textShine { to { background-position: 200% center; } }

        /* --- Main App Layout --- */
        .app-wrapper {
            opacity: 0; transform: scale(0.95) translateY(20px);
            transition: opacity 0.8s ease 0.6s, transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) 0.6s;
            width: 100%; max-width: 900px;
        }
        body.reveal .app-wrapper { opacity: 1; transform: scale(1) translateY(0); }

        .card-container {
            background: var(--white); border-radius: 24px; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 20px rgba(255,255,255,0.5) inset;
            overflow: hidden; display: grid; grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .card-container { grid-template-columns: 1.1fr 1fr; border-radius: 32px; }
            body { padding: 40px; }
        }

        /* Mobile-optimized padding */
        .section { padding: 25px 20px; }
        @media (min-width: 768px) { .section { padding: 45px; } }
        
        .calendar-section { background: var(--white); }
        @media (min-width: 768px) { .calendar-section { border-right: 1px solid var(--border-color); } }
        
        .form-section { background: #FAFAFB; display: flex; flex-direction: column; justify-content: center;}

        h1 { font-size: 1.4rem; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-top: 0; margin-bottom: 20px; font-weight: 800; text-transform: uppercase; color: var(--primary); letter-spacing: -0.5px; }

        /* --- Calendar Grid --- */
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: var(--text-muted);
            font-size: 0.8rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        }
        .calendar-grid { 
            display: grid; grid-template-columns: repeat(7, 1fr); 
            gap: 6px; /* Tighter gap for mobile */
            margin-top: 15px; 
        }
        @media (min-width: 768px) { .calendar-grid { gap: 8px; } }

        .day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 600; color: #CBD5E1; border-radius: 12px;
            user-select: none; /* Prevents text selection on quick taps */
        }

        .day.friday {
            color: var(--primary); border: 2px solid var(--border-color); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1); background: var(--white);
        }

        /* Touch & Hover states */
        @media (hover: hover) { .day.friday:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1); } }
        .day.friday:active { transform: scale(0.95); background: #F1F5F9; }
        
        .day.friday.selected { border-color: var(--accent); background: #EFF6FF; transform: scale(1.05); color: var(--accent); }
        
        /* Claimed State */
        .day.friday.claimed { background: var(--primary); color: var(--white); border-color: var(--primary); }
        .day.friday.claimed .click-hint { color: #94A3B8; }
        .day.friday.claimed:active { transform: scale(0.95); background: var(--primary-hover); }

        .click-hint { font-size: 0.6rem; text-transform: uppercase; margin-top: 2px; font-weight: 700; }

        /* --- Forms & Buttons --- */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        
        input {
            width: 100%; padding: 15px; border: 2px solid var(--border-color); border-radius: 12px;
            font-size: 16px; /* 16px exactly prevents iOS Safari auto-zoom */
            outline: none; transition: all 0.2s; background: var(--white); color: var(--text-main); font-weight: 500;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        input[readonly] { background: var(--border-color); color: var(--text-muted); border: none; font-weight: 600; }

        button.primary-btn {
            width: 100%; padding: 16px; background-color: var(--primary); color: var(--white); border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.2s; margin-top: 5px;
            box-shadow: 0 4px 6px rgba(15, 23, 42, 0.1);
        }
        button.primary-btn:hover { background-color: var(--primary-hover); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); transform: translateY(-1px); }
        button.primary-btn:active { transform: scale(0.98); box-shadow: 0 2px 4px rgba(15, 23, 42, 0.1); }

        /* --- Custom Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--white); padding: 30px; border-radius: 24px; width: 100%; max-width: 340px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); transform: scale(0.95) translateY(10px); transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        
        .modal-date { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px; }
        .modal-title { font-size: 1.6rem; margin-bottom: 8px; font-weight: 800; color: var(--primary); line-height: 1.2; }
        .modal-subtitle { color: var(--text-main); margin-bottom: 25px; font-size: 1.1rem; font-weight: 500; background: var(--bg-color); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
        
        .modal-btn { width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-size: 1rem; transition: all 0.2s; }
        .modal-close-btn { background: var(--bg-color); color: var(--text-main); margin-bottom: 10px; border: 1px solid var(--border-color); }
        .modal-close-btn:active { background: var(--border-color); transform: scale(0.98); }
        .modal-delete-btn { background: var(--danger-bg); color: var(--danger); }
        .modal-delete-btn:active { background: #FEE2E2; transform: scale(0.98); }
    </style>
</head>
<body>

<!-- High-Impact Cinematic Intro -->
<div id="intro-screen">
    <div class="intro-grid"></div>
    <div class="shockwave"></div>
    <div class="intro-content">
        <div class="intro-word word-1">Seminary</div>
        <div class="intro-word word-2">Food Signups</div>
    </div>
</div>

<!-- Modal Popup for Viewing Claims -->
<div class="modal-overlay" id="claimModal">
    <div class="modal-content">
        <div class="modal-date" id="modalDate">Oct 13</div>
        <div class="modal-title" id="modalName">Name</div>
        <div class="modal-subtitle" id="modalItem">Item</div>
        <button class="modal-btn modal-close-btn" id="modalCloseBtn">Close</button>
        <button class="modal-btn modal-delete-btn" id="modalDeleteBtn">Remove Sign-up</button>
    </div>
</div>

<!-- Main App -->
<div class="app-wrapper">
    <div class="card-container">
        
        <!-- Left Side: Calendar -->
        <div class="section calendar-section">
            <img src="your-custom-logo.png" alt="Seminary Logo" style="width: 100%; max-width: 100px; margin: 0 auto 20px auto; display: block; opacity: 0.9;">
            <h1>Select Date</h1>
            <div class="calendar-header">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS Populates Dates -->
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="section form-section">
            <h1>Commit</h1>
            
            <div class="form-group">
                <label for="date">Selected Date (Tap a Friday)</label>
                <input type="date" id="date" required readonly>
            </div>

            <div class="form-group">
                <label for="name">Who are you?</label>
                <input type="text" id="name" placeholder="E.g., Nephi" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="item">What are you bringing? <span style="font-weight: 400; text-transform: none; color: #94A3B8;">(Optional)</span></label>
                <input type="text" id="item" placeholder="E.g., Bagels" autocomplete="off">
            </div>

            <button id="submitBtn" class="primary-btn">Sign Up</button>
        </div>

    </div>
</div>

<!-- UI & Calendar Generation Script -->
<script>
    // Prevent zooming on double-tap (iOS feature)
    document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });

    // --- Timing the Action Intro ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            intro.classList.add('slide-up');
            document.body.classList.add('reveal');
            setTimeout(() => intro.remove(), 1200); 
        }, 4200); 
    });

    // --- Smart Calendar Logic ---
    const calendarGrid = document.getElementById('calendarGrid');
    const dateInput = document.getElementById('date');
    
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i = 0; i < firstDay; i++) {
        calendarGrid.appendChild(document.createElement('div'));
    }

    for(let i = 1; i <= daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.textContent = i;
        
        if (new Date(year, month, i).getDay() === 5) {
            dayDiv.classList.add('friday');
            
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(i).padStart(2, '0');
            const exactDate = `${year}-${formattedMonth}-${formattedDay}`;
            dayDiv.dataset.date = exactDate;
            
            const hint = document.createElement('div');
            hint.classList.add('click-hint');
            hint.textContent = "Open";
            dayDiv.appendChild(hint);
        }
        calendarGrid.appendChild(dayDiv);
    }

    // --- Modal Logic ---
    const modal = document.getElementById('claimModal');
    document.getElementById('modalCloseBtn').addEventListener('click', () => {
        modal.classList.remove('active');
    });
</script>

<!-- Firebase Connection & Real-time Database Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDR4--N5B5jKcrEb6nMzlIiTianU2kFMOU",
    authDomain: "seminarysignups.firebaseapp.com",
    projectId: "seminarysignups",
    storageBucket: "seminarysignups.firebasestorage.app",
    messagingSenderId: "22098394544",
    appId: "1:22098394544:web:310530f12eb50d1e232a75",
    measurementId: "G-H9039RGE0G"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- 1. Submitting a new Sign Up ---
  document.getElementById('submitBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const date = document.getElementById('date').value;
      const item = document.getElementById('item').value.trim(); 
      const btn = document.getElementById('submitBtn');

      if(name && date) {
          try {
              btn.textContent = "Saving...";
              btn.disabled = true;
              
              await addDoc(collection(db, "signups"), {
                  name: name,
                  date: date,
                  item: item, 
                  timestamp: new Date()
              });
              
              document.getElementById('name').value = '';
              document.getElementById('item').value = '';
              document.getElementById('date').value = '';
              document.querySelectorAll('.day.friday').forEach(el => el.classList.remove('selected'));
              
          } catch (error) {
              console.error("Error adding doc: ", error);
              alert("Error saving! Check console.");
          } finally {
              btn.textContent = "Sign Up";
              btn.disabled = false;
          }
      } else {
          alert("Please select a date and enter your name!");
      }
  });

  // --- 2. Live Calendar Updates & Clicking Logic ---
  const q = query(collection(db, "signups"));

  onSnapshot(q, (snapshot) => {
      document.querySelectorAll('.day.friday').forEach(el => {
          el.classList.remove('claimed');
          el.querySelector('.click-hint').textContent = "Open";
          delete el.dataset.claimId; 
          delete el.dataset.claimItem;
          delete el.dataset.claimName;
          
          el.onclick = function() {
              if(!this.classList.contains('claimed')) {
                  document.querySelectorAll('.day.friday').forEach(d => d.classList.remove('selected'));
                  this.classList.add('selected');
                  document.getElementById('date').value = this.dataset.date;
                  
                  if(window.innerWidth < 768) {
                      document.getElementById('name').scrollIntoView({ behavior: 'smooth', block: 'center' });
                  }
                  document.getElementById('name').focus();
              }
          };
      });

      snapshot.forEach((firebaseDoc) => {
          const data = firebaseDoc.data();
          const targetDay = document.querySelector(`.day.friday[data-date="${data.date}"]`);
          
          if(targetDay) {
              targetDay.classList.add('claimed');
              targetDay.classList.remove('selected');
              targetDay.querySelector('.click-hint').textContent = "Claimed";
              
              targetDay.dataset.claimId = firebaseDoc.id;
              targetDay.dataset.claimName = data.name;
              targetDay.dataset.claimItem = data.item || ""; 
              
              targetDay.onclick = function() {
                  const dateObj = new Date(this.dataset.date + 'T12:00:00');
                  const niceDate = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
                  
                  document.getElementById('modalDate').textContent = niceDate;
                  document.getElementById('modalName').textContent = this.dataset.claimName;
                  
                  const itemText = this.dataset.claimItem.trim();
                  document.getElementById('modalItem').textContent = itemText !== "" ? `Bringing: ${itemText}` : "Item: TBD";
                  
                  const deleteBtn = document.getElementById('modalDeleteBtn');
                  deleteBtn.onclick = async () => {
                      if(confirm("Remove this sign-up?")) {
                          await deleteDoc(doc(db, "signups", this.dataset.claimId));
                          document.getElementById('claimModal').classList.remove('active');
                      }
                  };

                  document.getElementById('claimModal').classList.add('active');
              };
          }
      });
  });
</script>

</body>
</html>
