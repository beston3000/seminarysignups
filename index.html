<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seminary Signups</title>
    <style>
        :root {
            /* Ultra-Minimalist B&W Palette */
            --black: #000000;
            --white: #ffffff;
            --gray-100: #F7F7F7;
            --gray-200: #EBEBEB;
            --gray-300: #D1D1D1;
            --gray-500: #888888;
            
            /* Typography */
            --font-display: "Georgia", "Times New Roman", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--gray-100);
            color: var(--black);
            padding: 15px;
            overflow-x: hidden;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- B&W CINEMATIC INTRO --- */
        #intro-screen {
            position: fixed; inset: 0;
            background: var(--black);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; overflow: hidden;
            transition: opacity 0.5s ease;
        }
        #intro-screen.hide { opacity: 0; pointer-events: none; }

        .horizon-beam {
            position: absolute; top: 50%; left: 0; right: 0; height: 1px;
            background: var(--white);
            box-shadow: 0 0 20px 5px rgba(255,255,255,0.8), 0 0 60px 20px rgba(255,255,255,0.4);
            transform: scaleX(0);
            animation: beamStrike 0.8s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }
        
        .sunburst {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 100vw;
            background: radial-gradient(circle, var(--white) 0%, rgba(255,255,255,0.8) 20%, transparent 60%);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0; mix-blend-mode: screen;
            animation: burstOpen 1s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s forwards;
        }

        .motes-container { position: absolute; inset: 0; z-index: 2; perspective: 600px; }
        .mote {
            position: absolute; bottom: -20px;
            width: 3px; height: 3px; background: var(--white); border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255,255,255,0.8); opacity: 0;
            animation: floatUp 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .intro-text {
            position: relative; z-index: 3;
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.5px;
            color: var(--white); text-align: center;
            opacity: 0; transform: translateY(20px) scale(0.95);
            animation: textRise 1s cubic-bezier(0.165, 0.84, 0.44, 1) 0.5s forwards;
        }

        @keyframes beamStrike { 0% { transform: scaleX(0); opacity: 1; } 40% { transform: scaleX(1); opacity: 1; } 80% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(1); opacity: 0; } }
        @keyframes burstOpen { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-200px); opacity: 0; } }
        @keyframes textRise { 0% { opacity: 0; transform: translateY(20px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        /* --- OPTIMAL MAIN UI --- */
        .app-wrapper {
            opacity: 0; transform: scale(0.98) translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            width: 100%; max-width: 900px; position: relative;
        }
        body.reveal .app-wrapper { opacity: 1; transform: scale(1) translateY(0); }

        .card-container {
            background: var(--white);
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0,0,0,0.02);
            overflow: hidden; display: grid; grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .card-container { grid-template-columns: 1fr 1fr; border-radius: 24px; }
            body { padding: 40px; }
        }

        .section { padding: 35px 25px; }
        @media (min-width: 768px) { .section { padding: 50px 45px; } }
        
        .calendar-section { background: var(--white); }
        .form-section { background: var(--white); display: flex; flex-direction: column; justify-content: center;}
        @media (min-width: 768px) { .form-section { border-left: 1px solid var(--gray-200); } }

        /* Month Navigation Header */
        .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .month-nav h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: normal; margin: 0; letter-spacing: -0.5px; }
        .nav-btn { background: none; border: 1px solid var(--gray-200); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; transition: all 0.2s; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { border-color: var(--black); background: var(--gray-100); }
        .nav-btn:active { transform: scale(0.95); }

        /* Form Header */
        h2.form-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: normal; margin-bottom: 30px; letter-spacing: -0.5px; }

        /* --- Minimalist Calendar Grid --- */
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; 
            font-weight: 600; color: var(--gray-500); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
            padding-bottom: 15px; border-bottom: 1px solid var(--gray-200);
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; }
        @media (min-width: 768px) { .calendar-grid { gap: 8px; } }

        .day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 500; color: var(--gray-300); border-radius: 12px; user-select: none;
        }

        /* Interactive Fridays */
        .day.friday {
            color: var(--black); border: 2px solid var(--gray-200); cursor: pointer;
            background: var(--white); transition: all 0.2s ease;
        }

        @media (hover: hover) { .day.friday:hover { border-color: var(--black); transform: translateY(-2px); } }
        .day.friday:active { transform: scale(0.95); }
        
        /* Selected State */
        .day.friday.selected { 
            border-color: var(--black); background: var(--gray-100); 
            transform: scale(1.05); font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        /* Claimed State */
        .day.friday.claimed { background: var(--black); color: var(--white); border-color: var(--black); }
        .day.friday.claimed .click-hint { color: var(--gray-500); }

        .click-hint { font-size: 0.55rem; text-transform: uppercase; margin-top: 4px; font-weight: 700; letter-spacing: 0.5px; }

        /* --- Refined Forms --- */
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; color: var(--gray-500); letter-spacing: 1px; }
        
        input {
            width: 100%; padding: 16px 18px; border: 2px solid transparent; border-radius: 12px;
            font-size: 16px; /* Prevents iOS zoom */
            outline: none; transition: all 0.2s; background: var(--gray-100); color: var(--black); font-weight: 500;
        }
        input:focus { border-color: var(--black); background: var(--white); }
        input[readonly] { background: var(--white); color: var(--gray-500); border: 1px dashed var(--gray-300); }

        /* Solid Black Button */
        button.primary-btn {
            width: 100%; padding: 18px; background: var(--black);
            color: var(--white); border: none; border-radius: 12px; 
            font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; 
            transition: all 0.2s ease; margin-top: 10px;
        }
        button.primary-btn:hover { background: #222; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1); }
        button.primary-btn:active { transform: scale(0.98); box-shadow: none; }

        /* --- Minimalist Modal --- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--white); padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 360px; text-align: center; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); transform: scale(0.95) translateY(10px); transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        
        .modal-date { font-size: 0.75rem; color: var(--gray-500); text-transform: uppercase; font-weight: 600; margin-bottom: 15px; letter-spacing: 1.5px; }
        .modal-title { font-family: var(--font-display); font-size: 2rem; margin-bottom: 10px; color: var(--black); letter-spacing: -0.5px; }
        .modal-subtitle { color: var(--black); margin-bottom: 30px; font-size: 1rem; font-weight: 500; background: var(--gray-100); padding: 15px; border-radius: 12px; }
        
        .modal-btn { width: 100%; padding: 16px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; }
        .modal-close-btn { background: var(--white); color: var(--black); margin-bottom: 12px; border: 2px solid var(--gray-200); }
        .modal-close-btn:hover { border-color: var(--black); }
        .modal-close-btn:active { transform: scale(0.98); }
        .modal-delete-btn { background: var(--white); color: #DC2626; border: 2px solid #FEE2E2; }
        .modal-delete-btn:hover { background: #FEF2F2; border-color: #DC2626; }
        .modal-delete-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<!-- B&W Cinematic Intro -->
<div id="intro-screen">
    <div class="horizon-beam"></div>
    <div class="sunburst"></div>
    <div class="motes-container" id="motes"></div>
    <div class="intro-text">Seminary Signups</div>
</div>

<!-- Minimalist Modal Popup -->
<div class="modal-overlay" id="claimModal">
    <div class="modal-content">
        <div class="modal-date" id="modalDate">Oct 13</div>
        <div class="modal-title" id="modalName">Name</div>
        <div class="modal-subtitle" id="modalItem">Item</div>
        <button class="modal-btn modal-close-btn" id="modalCloseBtn">Close</button>
        <button class="modal-btn modal-delete-btn" id="modalDeleteBtn">Remove Sign-up</button>
    </div>
</div>

<!-- Main App UI -->
<div class="app-wrapper">
    <div class="card-container">
        
        <!-- Calendar Section -->
        <div class="section calendar-section">
            <img src="your-custom-logo.png" alt="Logo" style="width: 100%; max-width: 80px; margin: 0 auto 20px auto; display: block; mix-blend-mode: multiply;">
            
            <!-- Month Navigation -->
            <div class="month-nav">
                <button id="prevMonth" class="nav-btn">&#8249;</button>
                <h1 id="monthDisplay">Month</h1>
                <button id="nextMonth" class="nav-btn">&#8250;</button>
            </div>

            <div class="calendar-header">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS Populates Dates -->
            </div>
        </div>

        <!-- Form Section -->
        <div class="section form-section">
            <h2 class="form-title">Commit</h2>
            
            <div class="form-group">
                <label for="date">Selected Date</label>
                <input type="date" id="date" required readonly>
            </div>

            <div class="form-group">
                <label for="name">Who are you?</label>
                <input type="text" id="name" placeholder="E.g., Nephi" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="item">Bringing what? <span style="font-weight: normal; color: var(--gray-500); text-transform: none; letter-spacing: 0;">(Optional)</span></label>
                <input type="text" id="item" placeholder="E.g., Bagels & Juice" autocomplete="off">
            </div>

            <button id="submitBtn" class="primary-btn">Confirm Sign-up</button>
        </div>

    </div>
</div>

<script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    // --- Firebase Setup ---
    const firebaseConfig = {
        apiKey: "AIzaSyDR4--N5B5jKcrEb6nMzlIiTianU2kFMOU",
        authDomain: "seminarysignups.firebaseapp.com",
        projectId: "seminarysignups",
        storageBucket: "seminarysignups.firebasestorage.app",
        messagingSenderId: "22098394544",
        appId: "1:22098394544:web:310530f12eb50d1e232a75",
        measurementId: "G-H9039RGE0G"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global variable to store all claims locally so we can redraw the calendar without re-fetching
    let allClaims = [];

    // --- iOS Double-tap Zoom Fix ---
    document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });

    // --- Fast B&W Intro ---
    window.addEventListener('load', () => {
        const motesContainer = document.getElementById('motes');
        for(let i=0; i<25; i++) {
            let mote = document.createElement('div');
            mote.className = 'mote';
            mote.style.left = `${Math.random() * 100}%`;
            mote.style.animationDelay = `${0.3 + (Math.random() * 0.5)}s`;
            motesContainer.appendChild(mote);
        }

        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            intro.classList.add('hide');
            document.body.classList.add('reveal');
            setTimeout(() => intro.remove(), 500); 
        }, 2000); 
    });

    // --- Calendar Generation & Month Navigation ---
    let currentNavDate = new Date();
    const calendarGrid = document.getElementById('calendarGrid');
    const monthDisplay = document.getElementById('monthDisplay');

    function renderCalendar() {
        const year = currentNavDate.getFullYear();
        const month = currentNavDate.getMonth();
        
        // Update Header Text
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        monthDisplay.textContent = `${monthNames[month]} ${year}`;

        // Clear existing grid
        calendarGrid.innerHTML = '';
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Add empty slots for days before the 1st
        for(let i = 0; i < firstDay; i++) {
            calendarGrid.appendChild(document.createElement('div'));
        }

        // Add actual days
        for(let i = 1; i <= daysInMonth; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.classList.add('day');
            dayDiv.textContent = i;
            
            if (new Date(year, month, i).getDay() === 5) {
                dayDiv.classList.add('friday');
                
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(i).padStart(2, '0');
                const exactDate = `${year}-${formattedMonth}-${formattedDay}`;
                dayDiv.dataset.date = exactDate;
                
                const hint = document.createElement('div');
                hint.classList.add('click-hint');
                hint.textContent = "Open";
                dayDiv.appendChild(hint);

                // Default Click Logic (Unclaimed)
                dayDiv.onclick = function() {
                    if(!this.classList.contains('claimed')) {
                        document.querySelectorAll('.day.friday').forEach(d => d.classList.remove('selected'));
                        this.classList.add('selected');
                        document.getElementById('date').value = this.dataset.date;
                        
                        if(window.innerWidth < 768) {
                            document.getElementById('name').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                        document.getElementById('name').focus();
                    }
                };
            }
            calendarGrid.appendChild(dayDiv);
        }

        // After drawing the grid, apply the claims from our local Firebase array
        applyClaimsToUI();
    }

    // Navigation Listeners
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentNavDate.setMonth(currentNavDate.getMonth() - 1);
        renderCalendar();
    });
    
    document.getElementById('nextMonth').addEventListener('click', () => {
        currentNavDate.setMonth(currentNavDate.getMonth() + 1);
        renderCalendar();
    });

    // Initial render
    renderCalendar();

    // --- Applying Firebase Data to the Calendar ---
    function applyClaimsToUI() {
        allClaims.forEach((data) => {
            // Check if the claimed date exists in the CURRENT rendered month
            const targetDay = document.querySelector(`.day.friday[data-date="${data.date}"]`);
            
            if(targetDay) {
                targetDay.classList.add('claimed');
                targetDay.classList.remove('selected');
                targetDay.querySelector('.click-hint').textContent = "Claimed";
                
                targetDay.onclick = function() {
                    const dateObj = new Date(data.date + 'T12:00:00');
                    const niceDate = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
                    
                    document.getElementById('modalDate').textContent = niceDate;
                    document.getElementById('modalName').textContent = data.name;
                    
                    const itemText = (data.item || "").trim();
                    document.getElementById('modalItem').textContent = itemText !== "" ? `Bringing: ${itemText}` : "Item: TBD";
                    
                    const deleteBtn = document.getElementById('modalDeleteBtn');
                    deleteBtn.onclick = async () => {
                        if(confirm("Remove this sign-up?")) {
                            await deleteDoc(doc(db, "signups", data.id));
                            document.getElementById('claimModal').classList.remove('active');
                        }
                    };

                    document.getElementById('claimModal').classList.add('active');
                };
            }
        });
    }

    // --- Firebase Listener ---
    const q = query(collection(db, "signups"));
    onSnapshot(q, (snapshot) => {
        allClaims = []; // Reset local array
        snapshot.forEach((firebaseDoc) => {
            let docData = firebaseDoc.data();
            docData.id = firebaseDoc.id; // Store ID for deletion
            allClaims.push(docData);
        });
        // Re-render the calendar to cleanly apply the new data state
        renderCalendar();
    });

    // --- Modal Close Logic ---
    const modal = document.getElementById('claimModal');
    document.getElementById('modalCloseBtn').addEventListener('click', () => {
        modal.classList.remove('active');
    });

    // --- Submitting Sign Up ---
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        const date = document.getElementById('date').value;
        const item = document.getElementById('item').value.trim(); 
        const btn = document.getElementById('submitBtn');

        if(name && date) {
            try {
                btn.textContent = "Saving...";
                btn.disabled = true;
                
                await addDoc(collection(db, "signups"), {
                    name: name,
                    date: date,
                    item: item, 
                    timestamp: new Date()
                });
                
                document.getElementById('name').value = '';
                document.getElementById('item').value = '';
                document.getElementById('date').value = '';
                
            } catch (error) {
                console.error("Error adding doc: ", error);
                alert("Error saving! Check console.");
            } finally {
                btn.textContent = "Confirm Sign-up";
                btn.disabled = false;
            }
        } else {
            alert("Please select a date and enter your name!");
        }
    });
</script>

</body>
</html>
