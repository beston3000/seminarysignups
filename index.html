<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminary Breakfast Sign-up</title>
    <style>
        :root {
            --black: #111111;
            --white: #ffffff;
            --light-gray: #f5f5f7;
            --border-color: #e1e1e1;
            --danger: #ff3b30;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            color: var(--black);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Upgraded Cinematic Curtain Intro --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--black);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
            color: var(--white);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            font-family: Georgia, serif;
        }

        #intro-screen.slide-up {
            transform: translateY(-100%);
        }

        .intro-text {
            font-size: 2rem; letter-spacing: 0.2rem;
            text-transform: uppercase; margin-bottom: 0.5rem;
            animation: fadeInOut 2.5s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        /* --- Main App Layout (Desktop & Mobile) --- */
        .app-wrapper {
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            transition: opacity 1s ease 0.5s, transform 1s cubic-bezier(0.165, 0.84, 0.44, 1) 0.5s;
            width: 100%;
            max-width: 1000px;
        }

        body.reveal .app-wrapper {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .card-container {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr; /* Mobile default */
        }

        /* Desktop Layout Override */
        @media (min-width: 768px) {
            .card-container { grid-template-columns: 1fr 1fr; }
            body { padding: 40px; }
        }

        .section { padding: 40px; }
        .calendar-section { background: var(--white); border-right: 1px solid var(--border-color); }
        .form-section { background: #fafafa; }

        h1, h2 { text-transform: uppercase; letter-spacing: -0.5px; margin-top: 0; }
        h1 { font-size: 1.8rem; border-bottom: 3px solid var(--black); padding-bottom: 10px; margin-bottom: 20px; }
        h2 { font-size: 1.2rem; color: #555; margin-bottom: 20px; }

        /* --- Calendar Grid --- */
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr);
            text-align: center; font-weight: 700; color: #888;
            font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        }
        
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 8px; margin-top: 15px;
        }

        .day {
            aspect-ratio: 1; /* Makes them perfect squares */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 600; color: #ccc;
            border-radius: 12px;
        }

        .day.friday {
            color: var(--black);
            border: 2px solid var(--black);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .day.friday:hover { background: #eee; transform: translateY(-2px); }
        .day.friday.selected { background: var(--black); color: var(--white); transform: scale(1.05); }

        .click-hint { font-size: 0.65rem; text-transform: uppercase; margin-top: 2px; }

        /* --- Forms & Buttons --- */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; color: #444; }
        
        input {
            width: 100%; padding: 16px; 
            border: 2px solid var(--border-color);
            border-radius: 12px; box-sizing: border-box; 
            font-size: 1rem; outline: none;
            transition: border-color 0.2s;
            background: var(--white);
        }
        input:focus { border-color: var(--black); }

        button.primary-btn {
            width: 100%; padding: 18px; 
            background-color: var(--black); color: var(--white); 
            border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase;
            cursor: pointer; transition: transform 0.1s, background-color 0.2s;
        }
        button.primary-btn:hover { background-color: #333; }
        button.primary-btn:active { transform: scale(0.98); }

        /* --- Live Signups List --- */
        .signup-list-container { margin-top: 40px; }
        .signup-item {
            background: var(--white);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .signup-details strong { display: block; font-size: 1rem; }
        .signup-details span { font-size: 0.85rem; color: #666; }
        
        .delete-btn {
            background: none; border: none; color: var(--danger);
            font-size: 1.2rem; cursor: pointer; padding: 5px 10px;
            transition: transform 0.2s;
        }
        .delete-btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>

<!-- Sleek Curtain Intro -->
<div id="intro-screen">
    <div class="intro-text">Seminary Fridays</div>
</div>

<!-- Main App -->
<div class="app-wrapper">
    <div class="card-container">
        
        <!-- Left Side: Calendar -->
        <div class="section calendar-section">
            <h1>Select Date</h1>
            <div class="calendar-header">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS Populates Dates -->
            </div>
        </div>

        <!-- Right Side: Form & List -->
        <div class="section form-section">
            <h1>Commit</h1>
            
            <div class="form-group">
                <label for="date">Date (Auto-fills)</label>
                <input type="date" id="date" required readonly style="background: #e9e9e9; color: #666;">
            </div>

            <div class="form-group">
                <label for="name">Who are you?</label>
                <input type="text" id="name" placeholder="E.g., Nephi" required>
            </div>

            <div class="form-group">
                <label for="item">What are you bringing?</label>
                <input type="text" id="item" placeholder="E.g., 2 Dozen Bagels" required>
            </div>

            <button id="submitBtn" class="primary-btn">Sign Up</button>

            <!-- Live List -->
            <div class="signup-list-container">
                <h2>Claimed Fridays</h2>
                <div id="liveSignups">
                    <p style="color: #888; font-size: 0.9rem;">Loading sign-ups...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- UI Logic Script -->
<script>
    // --- Cinematic Intro ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            intro.classList.add('slide-up');
            document.body.classList.add('reveal');
            
            // Remove from DOM after animation completes to free up interactions
            setTimeout(() => intro.remove(), 1200); 
        }, 2800);
    });

    // --- Smart Calendar Logic ---
    const calendarGrid = document.getElementById('calendarGrid');
    const dateInput = document.getElementById('date');
    
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i = 0; i < firstDay; i++) {
        const emptyDiv = document.createElement('div');
        calendarGrid.appendChild(emptyDiv);
    }

    for(let i = 1; i <= daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        
        const currentDate = new Date(year, month, i);
        dayDiv.textContent = i;
        
        if (currentDate.getDay() === 5) { // If it's a Friday
            dayDiv.classList.add('friday');
            
            const hint = document.createElement('div');
            hint.classList.add('click-hint');
            hint.textContent = "Open";
            dayDiv.appendChild(hint);
            
            dayDiv.addEventListener('click', function() {
                document.querySelectorAll('.day.friday').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(i).padStart(2, '0');
                dateInput.value = `${year}-${formattedMonth}-${formattedDay}`;
                
                // On mobile, scroll down to the form automatically
                if(window.innerWidth < 768) {
                    document.getElementById('name').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                document.getElementById('name').focus();
            });
        }
        calendarGrid.appendChild(dayDiv);
    }
</script>

<!-- Firebase Connection & Real-time Database Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDR4--N5B5jKcrEb6nMzlIiTianU2kFMOU",
    authDomain: "seminarysignups.firebaseapp.com",
    projectId: "seminarysignups",
    storageBucket: "seminarysignups.firebasestorage.app",
    messagingSenderId: "22098394544",
    appId: "1:22098394544:web:310530f12eb50d1e232a75",
    measurementId: "G-H9039RGE0G"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- Add a new sign up ---
  document.getElementById('submitBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value;
      const date = document.getElementById('date').value;
      const item = document.getElementById('item').value;
      const btn = document.getElementById('submitBtn');

      if(name && date && item) {
          try {
              btn.textContent = "Saving...";
              btn.disabled = true;
              
              await addDoc(collection(db, "signups"), {
                  name: name,
                  date: date,
                  item: item,
                  timestamp: new Date()
              });
              
              // Clear form
              document.getElementById('name').value = '';
              document.getElementById('item').value = '';
              document.getElementById('date').value = '';
              document.querySelectorAll('.day.friday').forEach(el => el.classList.remove('selected'));
              
          } catch (error) {
              console.error("Error adding doc: ", error);
              alert("Error saving! Check console.");
          } finally {
              btn.textContent = "Sign Up";
              btn.disabled = false;
          }
      } else {
          alert("Please select a date and fill out your info!");
      }
  });

  // --- Listen for live updates & render list ---
  const signupsContainer = document.getElementById('liveSignups');
  const q = query(collection(db, "signups"), orderBy("date"));

  onSnapshot(q, (snapshot) => {
      signupsContainer.innerHTML = ''; // Clear current list
      
      if(snapshot.empty) {
          signupsContainer.innerHTML = '<p style="color: #888; font-size: 0.9rem;">No one has signed up yet. Be the first!</p>';
          return;
      }

      snapshot.forEach((firebaseDoc) => {
          const data = firebaseDoc.data();
          
          // Format date to look nicer (e.g., 2026-09-11 -> Sep 11, 2026)
          const dateObj = new Date(data.date + 'T12:00:00'); // Forces local timezone display
          const niceDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

          const div = document.createElement('div');
          div.className = 'signup-item';
          div.innerHTML = `
              <div class="signup-details">
                  <strong>${data.name}</strong>
                  <span>${niceDate} — ${data.item}</span>
              </div>
              <button class="delete-btn" data-id="${firebaseDoc.id}" title="Remove Signup">✕</button>
          `;
          signupsContainer.appendChild(div);
      });

      // Attach delete listeners to newly rendered buttons
      document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
              const id = e.target.getAttribute('data-id');
              if(confirm("Are you sure you want to remove this sign-up?")) {
                  await deleteDoc(doc(db, "signups", id));
              }
          });
      });
  });
</script>

</body>
</html>
